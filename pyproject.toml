[project]
name = "okmigo-cartao"
version = "0.1.0"
description = "O crivo do cartão declarado do okmigo: valida e normaliza um Adaptive Card (subconjunto) do jeito que o produto faz — para quem escreve um app testar antes de registrar."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "TODO — decisão do dono do repositório"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
okmigo-cartao = "okmigo_cartao.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
