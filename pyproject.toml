[project]
name = "okmigo-cartao"
version = "0.13.0"
description = "O crivo do cartão declarado do okmigo: valida e normaliza um Adaptive Card (subconjunto) do jeito que o produto faz — para quem escreve um app testar antes de registrar."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
okmigo-cartao = "okmigo_cartao.__main__:main"
# ⭐ Os scripts que TODAS as esteiras do padrão rodam (OMINFRA-576). Ver
# `src/okmigo_cartao/esteira/__init__.py` para o porquê e a medição das cópias.
# ⚠️ Comando instalado, não caminho de arquivo: é o que permite a um repo trocar
# a cópia dele por uma chamada, sem saber onde o pacote foi instalado.
okmigo-versao-do-manifesto = "okmigo_cartao.esteira.versao_do_manifesto:main"
okmigo-abrir-pr-de-promocao = "okmigo_cartao.esteira.abrir_pr_de_promocao:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
okmigo_cartao = ["assets/*.js", "assets/*.css", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
