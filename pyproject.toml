[project]
name = "okmigo-cartao"
version = "0.4.0"
description = "O crivo do cartão declarado do okmigo: valida e normaliza um Adaptive Card (subconjunto) do jeito que o produto faz — para quem escreve um app testar antes de registrar."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
classifiers = ["License :: OSI Approved :: Apache Software License"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
okmigo-cartao = "okmigo_cartao.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
okmigo_cartao = ["assets/*.js", "assets/*.css", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
